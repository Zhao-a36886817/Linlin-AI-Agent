[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "linlin-agent-backend"
version = "1.0.0-rc.1"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "orjson==3.11.9",
  "psutil==7.2.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sse-starlette==3.4.6",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
training = [
  "accelerate==1.14.0",
  "numpy==2.5.1",
  "peft==0.20.0",
  "sentencepiece==0.2.1",
  "torch==2.13.0",
  "transformers==5.14.1",
]
dev = [
  # 根目錄治理與發布閘門腳本會讀取 YAML；主機測試環境必須明確宣告。
  "PyYAML==6.0.3",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 88
