name: Release Candidate Evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed semantic version
        required: true
        type: string
      evidence_confirmation:
        description: Type GENERATE_EVIDENCE; this builds evidence but does not approve or publish the RC
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  signed-candidate:
    if: inputs.evidence_confirmation == 'GENERATE_EVIDENCE'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            bundles: "deb appimage"
          - os: windows-latest
            artifact: windows
            # MSI/WiX 不接受 `rc` 文字預發行段；NSIS 可保留正式來源版本
            # 1.0.0-rc.N，不需要為打包偷偷改寫版本號。
            bundles: "nsis"
          - os: macos-latest
            artifact: macos
            bundles: "app dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked frontend
        run: npm ci --prefix frontend
      - name: Install locked desktop CLI
        run: corepack enable && pnpm --dir desktop install --frozen-lockfile
      - name: Validate source before signing
        run: python scripts/supply_chain.py scan
      - name: Build signed native candidate
        run: pnpm --dir desktop exec tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate SBOM
        run: python scripts/supply_chain.py sbom --output desktop/src-tauri/target/release/bundle/sbom.cdx.json
      # Tauri 可能在 build bundle 保留 AppDir 或 symbolic link 暫存內容。先萃取
      # 最終安裝檔與 SBOM，後續簽章、上傳、證據紀錄都只使用同一棵乾淨目錄。
      - name: Stage final native installers
        run: >-
          python scripts/release_evidence.py stage
          --source desktop/src-tauri/target/release/bundle
          --output "release-staging/${{ matrix.artifact }}"
          --platform "${{ matrix.artifact }}"
      # 簽署逐檔 SHA-256 清單，而不是只簽一個未解釋的壓縮檔；P24 驗證器會再確認
      # 清單內容與平台紀錄完全相同，讓每個原生成品都被同一個 workflow 身分綁定。
      - name: Generate native bundle checksum subject
        run: >-
          python scripts/release_evidence.py checksums
          --bundle "release-staging/${{ matrix.artifact }}"
          --output "release-evidence/${{ matrix.artifact }}.subjects.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: linlin-agent-${{ inputs.version }}-${{ matrix.artifact }}
          path: "release-staging/${{ matrix.artifact }}"
          if-no-files-found: error
          retention-days: 14
      # GitHub 內建 artifact attestation 不支援私人個人倉庫；改用免費 Sigstore
      # 公益服務。Action 固定到完整 SHA，並在同一步依 OIDC 身分與 Rekor 記錄驗證。
      - name: Sign and verify checksum subject with Sigstore
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: "release-evidence/${{ matrix.artifact }}.subjects.sha256"
          verify: true
          verify-cert-identity: "https://github.com/${{ github.workflow_ref }}"
          verify-oidc-issuer: "https://token.actions.githubusercontent.com"
          upload-signing-artifacts: false
          release-signing-artifacts: false
      - name: Record commit-bound platform evidence
        run: >-
          python scripts/release_evidence.py platform
          --root .
          --bundle "release-staging/${{ matrix.artifact }}"
          --output "release-evidence/${{ matrix.artifact }}.json"
          --attestation-bundle "release-evidence/${{ matrix.artifact }}.subjects.sha256.sigstore.json"
          --signed-subject "release-evidence/${{ matrix.artifact }}.subjects.sha256"
          --platform "${{ matrix.artifact }}"
          --version "${{ inputs.version }}"
          --source-commit "${{ github.sha }}"
          --repository "${{ github.repository }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --artifact-name "linlin-agent-${{ inputs.version }}-${{ matrix.artifact }}"
          --artifact-id "${{ steps.upload.outputs.artifact-id }}"
          --artifact-url "${{ steps.upload.outputs.artifact-url }}"
      - name: Upload platform evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linlin-agent-evidence-${{ matrix.artifact }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 14

  aggregate-evidence:
    if: inputs.evidence_confirmation == 'GENERATE_EVIDENCE'
    needs: signed-candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download three platform evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --name linlin-agent-evidence-windows --dir release-evidence
          gh run download "${{ github.run_id }}" --name linlin-agent-evidence-linux --dir release-evidence
          gh run download "${{ github.run_id }}" --name linlin-agent-evidence-macos --dir release-evidence
      - name: Build and validate aggregate provenance
        run: >-
          python scripts/release_evidence.py aggregate
          --evidence-dir release-evidence
          --source-commit "${{ github.sha }}"
          --version "${{ inputs.version }}"
      - name: Upload P24 release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linlin-agent-${{ inputs.version }}-p24-release-evidence
          path: release-evidence
          if-no-files-found: error
          retention-days: 30
